<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adrian Jade — Cloud Security Engineer</title>
  <meta name="description" content="Cloud Security Engineer portfolio of Adrian Jade (@adrianjadev) — Google Cloud IAM, Zero-Trust networking, Terraform IaC, Kubernetes hardening, and DevSecOps." />

  <style>
    /* =========================================================================
       ADRIAN JADE — MINERAL JADE & SLATE EDITORIAL DESIGN SYSTEM
       Original minimalist brand · Warm alabaster surfaces · Restrained mineral
       jade accent · Core engineering proof-of-work · Zero decorative clutter
       ========================================================================= */
    :root {
      /* Surfaces — Warm Mineral Alabaster */
      --bg: #f6f7f5;
      --surface: #ffffff;
      --surface-subtle: #eff2f0;
      --surface-hover: #e7ece9;

      /* Borders */
      --border: #dfe5e2;
      --border-strong: #c6d0cc;

      /* Ink — Deep Mineral Slate */
      --ink: #101614;
      --ink-secondary: #46514d;
      --ink-muted: #697570;
      --ink-faint: #929e99;

      /* Signature Brand Accent — Fine-Tuned Deep Nephrite Mineral Jade */
      --jade: #115e50;
      --jade-hover: #0b463b;
      --jade-soft: #1d7a69;
      --jade-tint: rgba(17, 94, 80, 0.075);
      --jade-tint-strong: rgba(17, 94, 80, 0.13);
      --jade-border: rgba(17, 94, 80, 0.27);

      /* Inverted Controls */
      --invert-bg: #101614;
      --invert-fg: #f6f7f5;

      /* Code Surface */
      --code-bg: #101614;
      --code-fg: #e7eeeb;
      --code-muted: #82908b;

      /* Elevation */
      --shadow-card: 0 1px 2px rgba(16, 22, 20, 0.04);
      --shadow-card-hover: 0 8px 22px rgba(16, 22, 20, 0.065), 0 1px 3px rgba(16, 22, 20, 0.04);
      --shadow-overlay: 0 24px 64px rgba(10, 15, 13, 0.18);

      /* Typography */
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
      --font-serif: "Newsreader", Georgia, "Iowan Old Style", "Times New Roman", serif;

      --radius-xs: 5px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-full: 999px;

      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --dur-fast: 150ms;
      --dur-base: 240ms;
    }

    [data-theme="dark"] {
      --bg: #0b0e0d;
      --surface: #121615;
      --surface-subtle: #181d1b;
      --surface-hover: #1f2623;

      --border: #222927;
      --border-strong: #303a37;

      --ink: #eef3f1;
      --ink-secondary: #a4b0ac;
      --ink-muted: #76837e;
      --ink-faint: #4f5b57;

      /* Fine-Tuned Celadon Mineral Jade (high-contrast, non-neon) */
      --jade: #3bb89c;
      --jade-hover: #58cca9;
      --jade-soft: #2c967e;
      --jade-tint: rgba(59, 184, 156, 0.11);
      --jade-tint-strong: rgba(59, 184, 156, 0.18);
      --jade-border: rgba(59, 184, 156, 0.32);

      --invert-bg: #eef3f1;
      --invert-fg: #0b0e0d;

      --code-bg: #070a09;
      --code-fg: #e7eeeb;
      --code-muted: #75847f;

      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.36);
      --shadow-card-hover: 0 10px 28px rgba(0, 0, 0, 0.46);
      --shadow-overlay: 0 28px 72px rgba(0, 0, 0, 0.72);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.6;
      transition: background-color var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid var(--jade);
      outline-offset: 2px;
    }

    ::selection {
      background: var(--jade-tint);
      color: var(--ink);
    }

    /* Subtle entrance */
    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .reveal {
      opacity: 0;
      animation: reveal 420ms var(--ease) forwards;
    }
    .d1 { animation-delay: 40ms; }
    .d2 { animation-delay: 90ms; }
    .d3 { animation-delay: 140ms; }
    .d4 { animation-delay: 190ms; }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; animation: none; }
      html { scroll-behavior: auto; }
    }

    /* =========================================================================
       TOP NAVIGATION BAR — CLEAN STICKY GLASS HEADER
       ========================================================================= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.94rem;
      letter-spacing: -0.02em;
      color: var(--ink);
      flex-shrink: 0;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--invert-bg);
      color: var(--invert-fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: -0.04em;
      position: relative;
      border: 1px solid var(--border-strong);
      flex-shrink: 0;
    }

    .brand-mark-inner {
      width: 100%;
      height: 100%;
      border-radius: 7px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--jade);
      border: 1.5px solid var(--bg);
      z-index: 2;
    }

    /* Profile Photo Branding Components */
    .avatar-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0;
      transition: opacity 280ms var(--ease), transform 320ms var(--ease);
    }

    .avatar-img.loaded {
      opacity: 1;
    }

    .avatar-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--surface-subtle) 0%, var(--jade-tint-strong) 100%);
      color: var(--jade);
      font-family: var(--font-mono);
      font-weight: 600;
      letter-spacing: -0.04em;
      user-select: none;
    }

    .brand-mark .avatar-fallback {
      background: var(--invert-bg);
      color: var(--invert-fg);
      font-size: 0.7rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-item {
      padding: 6px 11px;
      border-radius: var(--radius-xs);
      font-size: 0.85rem;
      color: var(--ink-secondary);
      transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
    }

    .nav-item:hover {
      color: var(--ink);
      background: var(--surface-subtle);
    }

    .nav-item.active {
      color: var(--ink);
      font-weight: 550;
      background: var(--surface-subtle);
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .cmd-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.78rem;
      color: var(--ink-muted);
      transition: all var(--dur-fast) var(--ease);
    }

    .cmd-btn:hover {
      border-color: var(--border-strong);
      color: var(--ink);
    }

    .kbd {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--ink-muted);
      line-height: 1.35;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all var(--dur-fast) var(--ease);
    }

    .icon-btn:hover {
      border-color: var(--border-strong);
      color: var(--ink);
      background: var(--surface-subtle);
    }

    .mobile-toggle {
      display: none;
    }

    .mobile-nav-bar {
      display: none;
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 10px 24px 14px;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mobile-nav-bar.open {
      display: flex;
    }

    /* =========================================================================
       CONTAINER & PAGE RHYTHM
       ========================================================================= */
    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 56px 24px 96px;
    }

    /* =========================================================================
       HERO — POSITIONING, PROFILE PHOTO BRANDING & POSTURE METADATA STRIP
       ========================================================================= */
    .hero {
      margin-bottom: 68px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 288px;
      gap: 44px;
      align-items: center;
      margin-bottom: 36px;
    }

    .hero-copy {
      min-width: 0;
    }

    .availability-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--jade-border);
      background: var(--jade-tint);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--jade);
      letter-spacing: 0.01em;
      margin-bottom: 20px;
    }

    .jade-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--jade);
      flex-shrink: 0;
    }

    .hero-title {
      font-size: clamp(2.05rem, 4.2vw, 2.95rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.08;
      color: var(--ink);
      margin-bottom: 16px;
      max-width: 640px;
    }

    .hero-title .accent-word {
      color: var(--jade);
    }

    .hero-lead {
      font-size: 1.02rem;
      line-height: 1.7;
      color: var(--ink-secondary);
      max-width: 620px;
      margin-bottom: 24px;
    }

    .hero-lead strong {
      color: var(--ink);
      font-weight: 560;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    /* Creative Architectural Mineral-Jade Photo Frame */
    .portrait-stage {
      position: relative;
      padding: 0 12px 12px 0;
      width: 100%;
    }

    .portrait-backplate {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 0;
      bottom: 0;
      border-radius: 18px;
      border: 1px solid var(--jade-border);
      background-color: var(--jade-tint);
      background-image: radial-gradient(color-mix(in srgb, var(--jade) 28%, transparent) 1px, transparent 1px);
      background-size: 11px 11px;
      transition: transform var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
      pointer-events: none;
    }

    .portrait-card {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      transition: transform var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
    }

    .portrait-stage:hover .portrait-card {
      transform: translate(-3px, -3px);
      border-color: var(--jade-border);
      box-shadow: var(--shadow-card-hover);
    }

    .portrait-stage:hover .portrait-backplate {
      transform: translate(3px, 3px);
      border-color: var(--jade);
    }

    .portrait-strip-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 3px 9px;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .portrait-strip-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--jade);
      font-weight: 550;
    }

    .portrait-viewport {
      position: relative;
      padding: 6px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .frame-corner {
      position: absolute;
      width: 11px;
      height: 11px;
      border-color: var(--jade);
      border-style: solid;
      border-width: 0;
      opacity: 0.72;
      pointer-events: none;
      z-index: 3;
      transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
    }

    .frame-corner.tl { top: 0; left: 0; border-top-width: 1.5px; border-left-width: 1.5px; border-top-left-radius: 11px; }
    .frame-corner.tr { top: 0; right: 0; border-top-width: 1.5px; border-right-width: 1.5px; border-top-right-radius: 11px; }
    .frame-corner.bl { bottom: 0; left: 0; border-bottom-width: 1.5px; border-left-width: 1.5px; border-bottom-left-radius: 11px; }
    .frame-corner.br { bottom: 0; right: 0; border-bottom-width: 1.5px; border-right-width: 1.5px; border-bottom-right-radius: 11px; }

    .portrait-stage:hover .frame-corner {
      opacity: 1;
    }

    .portrait-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 4.2;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
    }

    .portrait-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      pointer-events: none;
      z-index: 2;
    }

    .portrait-stage:hover .portrait-frame .avatar-img.loaded {
      transform: scale(1.03);
    }

    .portrait-fallback-initials {
      font-size: 2.6rem;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .portrait-fallback-sub {
      margin-top: 8px;
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-muted);
    }

    .portrait-badge {
      position: absolute;
      left: 9px;
      bottom: 9px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: var(--radius-full);
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--jade-border);
      font-family: var(--font-mono);
      font-size: 0.63rem;
      font-weight: 560;
      color: var(--jade);
      z-index: 3;
      box-shadow: 0 2px 8px rgba(16, 22, 20, 0.1);
    }

    .portrait-meta {
      padding: 11px 3px 2px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .portrait-handle {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .portrait-stage:hover .portrait-handle {
      color: var(--jade);
    }

    .portrait-role {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--ink-muted);
      letter-spacing: 0.02em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: var(--radius-xs);
      font-size: 0.86rem;
      font-weight: 550;
      transition: all var(--dur-fast) var(--ease);
    }

    .btn-primary {
      background: var(--invert-bg);
      color: var(--invert-fg);
      border: 1px solid var(--invert-bg);
    }

    .btn-primary:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-card);
    }

    .btn-secondary:hover {
      background: var(--surface-subtle);
      border-color: var(--ink-muted);
    }

    .btn-ghost {
      padding: 9px 10px;
      color: var(--ink-secondary);
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }

    .btn-ghost:hover {
      color: var(--jade);
    }

    /* Architectural Posture Strip (Original Identity Element) */
    .posture-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .posture-cell {
      padding: 15px 16px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .posture-cell:last-child {
      border-right: none;
    }

    .posture-label {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }

    .posture-value {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.35;
    }

    .posture-link {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--jade);
    }

    .posture-link:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* =========================================================================
       SECTION STRUCTURE — CLEAN ARCHITECTURAL HEADERS
       ========================================================================= */
    .section {
      margin-bottom: 72px;
      scroll-margin-top: 84px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .section-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--jade);
      margin-bottom: 4px;
    }

    .section-title {
      font-size: 1.32rem;
      font-weight: 650;
      letter-spacing: -0.025em;
      color: var(--ink);
      line-height: 1.2;
    }

    .section-meta {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .section-meta a:hover {
      color: var(--jade);
    }

    /* =========================================================================
       WORK — FILTERABLE SECURITY BLUEPRINTS GRID
       ========================================================================= */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-pill {
      font-size: 0.8rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink-secondary);
      transition: all var(--dur-fast) var(--ease);
    }

    .filter-pill:hover {
      border-color: var(--border-strong);
      color: var(--ink);
    }

    .filter-pill.active {
      background: var(--invert-bg);
      color: var(--invert-fg);
      border-color: var(--invert-bg);
    }

    .filter-count {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--ink-muted);
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .work-card {
      text-align: left;
      padding: 20px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
    }

    .work-card.featured {
      grid-column: 1 / -1;
      padding: 24px;
      border-color: var(--border-strong);
      border-top: 2px solid var(--jade);
    }

    .work-card:hover {
      transform: translateY(-2px);
      border-color: var(--jade-border);
      box-shadow: var(--shadow-card-hover);
    }

    .work-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .work-domain {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--ink-secondary);
    }

    .status-chip.verified {
      border-color: var(--jade-border);
      background: var(--jade-tint);
      color: var(--jade);
    }

    .work-title {
      font-size: 1.04rem;
      font-weight: 630;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .work-card.featured .work-title {
      font-size: 1.16rem;
    }

    .work-summary {
      font-size: 0.87rem;
      color: var(--ink-secondary);
      line-height: 1.58;
    }

    .work-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chip {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      color: var(--ink-muted);
      background: var(--surface-subtle);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .inspect-cue {
      font-family: var(--font-mono);
      font-size: 0.73rem;
      color: var(--ink-secondary);
      white-space: nowrap;
      transition: color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
    }

    .work-card:hover .inspect-cue {
      color: var(--jade);
      transform: translateX(2px);
    }

    /* =========================================================================
       DEDICATED PROJECTS REPO & LIVE GITHUB LEDGER
       ========================================================================= */
    .repo-hub {
      border: 1px solid var(--jade-border);
      border-radius: var(--radius-md);
      background: linear-gradient(180deg, var(--jade-tint) 0%, var(--surface) 44%);
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .repo-hub-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .repo-hub-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--ink);
    }

    .repo-hub-name svg {
      color: var(--jade);
    }

    .repo-hub-desc {
      font-size: 0.87rem;
      color: var(--ink-secondary);
      line-height: 1.58;
      max-width: 660px;
      margin-top: 6px;
    }

    .repo-tree {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .repo-tree-cell {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .repo-tree-dir {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--jade);
    }

    .repo-tree-note {
      font-size: 0.75rem;
      color: var(--ink-muted);
      line-height: 1.4;
    }

    .repo-hub-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .sync-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--ink-muted);
    }

    .sync-pill.live {
      border-color: var(--jade-border);
      background: var(--jade-tint);
      color: var(--jade);
    }

    .mini-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--ink-secondary);
      transition: all var(--dur-fast) var(--ease);
    }

    .mini-action-btn:hover {
      border-color: var(--jade-border);
      color: var(--jade);
      background: var(--jade-tint);
    }

    .repo-ledger {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .repo-row {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      transition: background-color var(--dur-fast) var(--ease);
    }

    .repo-row:last-child {
      border-bottom: none;
    }

    .repo-row:hover {
      background: var(--surface-subtle);
    }

    .repo-head-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .repo-name-link {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .repo-name-link:hover {
      color: var(--jade);
    }

    .repo-desc {
      font-size: 0.84rem;
      color: var(--ink-secondary);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .repo-meta-line {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--ink-muted);
    }

    .lang-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--ink-secondary);
    }

    .lang-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--jade);
      flex-shrink: 0;
    }

    .repo-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* =========================================================================
       FIELD NOTES — EDITORIAL LEDGER
       ========================================================================= */
    .notes-ledger {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .note-row {
      width: 100%;
      text-align: left;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr) auto;
      gap: 18px;
      align-items: baseline;
      transition: background-color var(--dur-fast) var(--ease);
    }

    .note-row:last-child {
      border-bottom: none;
    }

    .note-row:hover {
      background: var(--surface-subtle);
    }

    .note-date {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--ink-muted);
    }

    .note-title {
      font-size: 0.96rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .note-row:hover .note-title {
      color: var(--jade);
    }

    .note-excerpt {
      font-size: 0.85rem;
      color: var(--ink-secondary);
      line-height: 1.55;
    }

    .note-read {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    /* =========================================================================
       BACKGROUND — EXPERIENCE + STRUCTURED CAPABILITIES MATRIX
       ========================================================================= */
    .exp-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 32px;
    }

    .exp-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .exp-trigger {
      width: 100%;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: baseline;
      text-align: left;
      transition: background-color var(--dur-fast) var(--ease);
    }

    .exp-trigger:hover {
      background: var(--surface-subtle);
    }

    .exp-period {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--ink-muted);
    }

    .exp-role {
      font-size: 0.95rem;
      font-weight: 610;
      color: var(--ink);
    }

    .exp-org {
      font-size: 0.83rem;
      color: var(--ink-secondary);
      margin-top: 2px;
    }

    .exp-chevron {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--ink-muted);
    }

    .exp-panel {
      padding: 0 20px 18px 148px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .bullet-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .bullet-list li {
      position: relative;
      padding-left: 16px;
      font-size: 0.86rem;
      color: var(--ink-secondary);
      line-height: 1.58;
    }

    .bullet-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      width: 6px;
      height: 1.5px;
      background: var(--jade);
    }

    /* Core Capabilities Grid (4 Pillars) */
    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .pillar-card {
      padding: 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow-card);
    }

    .pillar-title {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--jade);
      margin-bottom: 10px;
    }

    .pillar-items {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pillar-tag {
      font-size: 0.79rem;
      color: var(--ink-secondary);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: var(--radius-xs);
    }

    /* =========================================================================
       CREDENTIALS LEDGER
       ========================================================================= */
    .cred-ledger {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .cred-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      transition: background-color var(--dur-fast) var(--ease);
    }

    .cred-row:last-child {
      border-bottom: none;
    }

    .cred-row:hover {
      background: var(--surface-subtle);
    }

    .cred-main {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .cred-code {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ink);
      flex-shrink: 0;
    }

    .cred-row.verified .cred-code {
      border-color: var(--jade-border);
      background: var(--jade-tint);
      color: var(--jade);
    }

    .cred-name {
      font-size: 0.93rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
    }

    .cred-issuer {
      font-size: 0.8rem;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .cred-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .cred-verify {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--ink-secondary);
    }

    .cred-row:hover .cred-verify {
      color: var(--jade);
    }

    /* =========================================================================
       FOOTER — CLEAN CONTACT BAND
       ========================================================================= */
    .footer-card {
      padding: 28px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .footer-identity {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .footer-avatar {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--jade-border);
      background: var(--surface-subtle);
      flex-shrink: 0;
    }

    .footer-avatar .avatar-fallback {
      font-size: 0.9rem;
    }

    .footer-heading {
      font-size: 1.24rem;
      font-weight: 650;
      letter-spacing: -0.025em;
      margin-bottom: 4px;
    }

    .footer-copy {
      font-size: 0.88rem;
      color: var(--ink-secondary);
      max-width: 460px;
    }

    .footer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .colophon {
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--ink-muted);
    }

    /* =========================================================================
       SLIDE-OVER DRAWER (CASE STUDY + FIELD NOTE READER)
       ========================================================================= */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(12, 14, 13, 0.46);
      display: flex;
      justify-content: flex-end;
    }

    .drawer {
      width: 100%;
      max-width: 650px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border-strong);
      box-shadow: var(--shadow-overlay);
      display: flex;
      flex-direction: column;
    }

    .drawer-head {
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .drawer-kicker {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--jade);
      margin-bottom: 5px;
    }

    .drawer-title {
      font-size: 1.18rem;
      font-weight: 650;
      letter-spacing: -0.025em;
      line-height: 1.28;
    }

    .drawer-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-subtle);
    }

    .drawer-tab {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      padding: 5px 11px;
      border-radius: var(--radius-xs);
      color: var(--ink-secondary);
      transition: all var(--dur-fast) var(--ease);
    }

    .drawer-tab:hover {
      color: var(--ink);
      background: var(--surface-hover);
    }

    .drawer-tab.active {
      background: var(--invert-bg);
      color: var(--invert-fg);
    }

    .drawer-body {
      padding: 24px 24px 40px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .drawer-section h4 {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      margin-bottom: 8px;
    }

    .drawer-section p {
      font-size: 0.91rem;
      color: var(--ink-secondary);
      line-height: 1.68;
    }

    .diagram-frame {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px;
      background: var(--bg);
      overflow-x: auto;
    }

    .code-frame {
      border-radius: var(--radius-sm);
      background: var(--code-bg);
      color: var(--code-fg);
      border: 1px solid var(--border-strong);
      overflow: hidden;
    }

    .code-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--code-muted);
    }

    .code-copy {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 2px 9px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--code-fg);
    }

    .code-copy:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .code-pre {
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      line-height: 1.65;
      overflow-x: auto;
      white-space: pre;
    }

    .serif-callout {
      padding: 13px 16px;
      border-left: 3px solid var(--jade);
      background: var(--jade-tint);
      border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
      font-size: 0.86rem;
      color: var(--ink);
      line-height: 1.58;
    }

    .serif-article {
      font-family: var(--font-serif);
      font-size: 1.07rem;
      line-height: 1.8;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .drawer-foot {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* =========================================================================
       QUICK JUMP COMMAND PALETTE (⌘K / Ctrl+K)
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 120;
      background: rgba(12, 14, 13, 0.5);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 12vh 16px 16px;
    }

    .palette {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-overlay);
      overflow: hidden;
    }

    .palette-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .palette-input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 0.92rem;
      outline: none;
    }

    .palette-list {
      max-height: 340px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .palette-group {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      padding: 8px 10px 4px;
    }

    .palette-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 10px;
      border-radius: var(--radius-xs);
      font-size: 0.86rem;
      color: var(--ink-secondary);
      text-align: left;
      transition: background-color var(--dur-fast) var(--ease);
    }

    .palette-item:hover {
      background: var(--surface-subtle);
      color: var(--ink);
    }

    .palette-kind {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--ink-faint);
      white-space: nowrap;
    }

    /* Toast */
    .toast {
      position: fixed;

            )
          : h("div", { className: "avatar-fallback", "aria-hidden": status === "loaded" ? "true" : "false" }, monogram);

      return h(React.Fragment, null,
        fallback,
        src && status !== "error"
          ? h("img", {
              ref: imgRef,
              onLoad: () => setStatus("loaded"),
              onError: () => setStatus("error"),

    function formatRepoDate(iso) {
      if (!iso) return "";
      try {
        const d = new Date(iso);
        return d.toLocaleDateString("en-US", { month: "short", year: "numeric" });
      } catch (_) {

    function useGitHubRepos(username, fallbackRepos, enabled, maxRepos) {
      const [state, setState] = React.useState({
        repos: fallbackRepos,
        status: enabled ? "loading" : "fallback",
        liveCount: 0,
        avatarUrl: ""
      });
      const [nonce, setNonce] = React.useState(0);

      React.useEffect(() => {
        if (!enabled || !username) {
          setState({ repos: fallbackRepos, status: "fallback", liveCount: 0, avatarUrl: "" });
          return;
        }

        const cacheKey = `aj-gh-repos:pushed:${username}`;
        if (nonce === 0) {
          try {
            const cached = JSON.parse(sessionStorage.getItem(cacheKey) || "null");
            if (cached && Date.now() - cached.ts < 300000 && Array.isArray(cached.repos) && cached.repos.length > 0) {
              setState({ repos: cached.repos, status: "live", liveCount: cached.repos.length, avatarUrl: cached.avatarUrl || "" });
              return;
            }
          } catch (_) {}
        }

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 4500);
        setState(prev => ({ ...prev, status: "loading" }));

        fetch(`https://api.github.com/users/${encodeURIComponent(username)}/repos?sort=pushed&direction=desc&per_page=100&type=owner`, {
          headers: { Accept: "application/vnd.github+json" },
          signal: controller.signal
        })
          .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
          })
          .then(raw => {
            clearTimeout(timer);
            if (!Array.isArray(raw)) throw new Error("Unexpected response");
            const rawAvatar = raw[0] && raw[0].owner && raw[0].owner.avatar_url ? raw[0].owner.avatar_url : "";
            const apiAvatar = rawAvatar ? `${rawAvatar}${rawAvatar.includes("?") ? "&" : "?"}s=400` : "";
            const mapped = raw
              .filter(r => !r.fork && !r.archived && r.name.toLowerCase() !== `${username.toLowerCase()}.github.io`)
              .sort((a, b) => new Date(b.pushed_at || b.updated_at || 0) - new Date(a.pushed_at || a.updated_at || 0))
              .slice(0, maxRepos)
              .map(r => ({
                name: r.name,
                description: r.description || "Cloud security engineering repository.",
                language: r.language || "Docs",
                topics: Array.isArray(r.topics) ? r.topics : [],
                url: r.html_url,
                cloneUrl: r.clone_url,
                stars: r.stargazers_count || 0,
                forks: r.forks_count || 0,
                updated: formatRepoDate(r.pushed_at || r.updated_at),
                featured: r.name === PORTFOLIO.projectsHub.name
              }));

            if (mapped.length > 0) {
              try { sessionStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), repos: mapped, avatarUrl: apiAvatar })); } catch (_) {}
              setState({ repos: mapped, status: "live", liveCount: mapped.length, avatarUrl: apiAvatar });
            } else {
              setState({ repos: fallbackRepos, status: "empty", liveCount: 0, avatarUrl: apiAvatar });
            }
          })
          .catch(() => {
            clearTimeout(timer);
            setState({ repos: fallbackRepos, status: "fallback", liveCount: 0, avatarUrl: "" });
          });

        return () => {
          clearTimeout(timer);
          controller.abort();
        };
      }, [username, enabled, maxRepos, nonce]);

      return {
        ...state,
        refresh: () => setNonce(n => n + 1)
      };
    }

            i < n - 1 ? h("line", { x1: String(x + w), y1: "51", x2: String(x + w + gap), y2: "51", stroke: "var(--jade)", strokeWidth: "1.4" }) : null
          );
        })
      );
    }

    function QuickJump({ open, onClose, repos, onSelectProject, onSelectNote, onToggleTheme, onCopyEmail }) {
      const [query, setQuery] = React.useState("");
      const inputRef = React.useRef(null);

      React.useEffect(() => {
        if (open) {
          setQuery("");
          setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 10);
        }
      }, [open]);

      const q = query.trim().toLowerCase();

      const groups = React.useMemo(() => {
        const jump = [
          { id: "sec-work", label: "Work & Security Blueprints", kind: "Section", run: () => { window.location.hash = "#work"; onClose(); } },
          { id: "sec-repos", label: "Dedicated Projects & GitHub Repos", kind: "Section", run: () => { window.location.hash = "#repos"; onClose(); } },
          { id: "sec-notes", label: "Engineering Field Notes", kind: "Section", run: () => { window.location.hash = "#notes"; onClose(); } },
          { id: "sec-background", label: "Background & Capabilities", kind: "Section", run: () => { window.location.hash = "#background"; onClose(); } },
          { id: "sec-credentials", label: "Credentials & Verification", kind: "Section", run: () => { window.location.hash = "#credentials"; onClose(); } }
        ];
        const work = PORTFOLIO.projects.map(p => ({
          id: p.id, label: p.title, kind: p.category, run: () => { onSelectProject(p); onClose(); }
        }));
        const repoItems = (repos || []).map(r => ({
          id: `repo-${r.name}`,
          label: `${PORTFOLIO.githubHandle}/${r.name}`,
          kind: r.language || "Repo",
          run: () => { window.open(r.url, "_blank", "noopener,noreferrer"); onClose(); }
        }));
        const notes = PORTFOLIO.notes.map(n => ({
          id: n.id, label: n.title, kind: "Note", run: () => { onSelectNote(n); onClose(); }
        }));
        const actions = [
          { id: "act-theme", label: "Switch Light / Dark theme", kind: "Action", run: () => { onToggleTheme(); onClose(); } },
          { id: "act-copy", label: `Copy email (${PORTFOLIO.email})`, kind: "Action", run: () => { onCopyEmail(); onClose(); } },
          { id: "act-print", label: "Print / Save Resume PDF", kind: "Action", run: () => { onClose(); setTimeout(() => window.print(), 80); } }
        ];

        const filter = (list) => !q ? list : list.filter(i => i.label.toLowerCase().includes(q) || i.kind.toLowerCase().includes(q));
        return [
          { title: "Case Studies", items: filter(work) },
          { title: "Repositories", items: filter(repoItems) },
          { title: "Field Notes", items: filter(notes) },
          { title: "Navigate", items: filter(jump) },
          { title: "Actions", items: filter(actions) }
        ].filter(g => g.items.length > 0);
      }, [q, repos, onClose, onSelectProject, onSelectNote, onToggleTheme, onCopyEmail]);

      if (!open) return null;

      return h("div", { className: "modal-backdrop", onClick: (e) => { if (e.target === e.currentTarget) onClose(); } },
        h("div", { className: "palette", role: "dialog", "aria-modal": "true", "aria-label": "Quick jump" },
          h("div", { className: "palette-input-row" },
            h(Icon, { name: "search", size: 15 }),
            h("input", {
              ref: inputRef,
              className: "palette-input",
              type: "text",
              placeholder: "Search case studies, notes, or actions...",
              value: query,
              onChange: (e) => setQuery(e.target.value),
              onKeyDown: (e) => { if (e.key === "Escape") onClose(); }
            }),
            h("span", { className: "kbd" }, "ESC")
          ),
          h("div", { className: "palette-list" },
            groups.length === 0
              ? h("div", { style: { padding: "14px 10px", fontSize: "0.84rem", color: "var(--ink-muted)" } }, "No matching items.")
              : groups.map(g =>
                  h(React.Fragment, { key: g.title },
                    h("div", { className: "palette-group" }, g.title),
                    ...g.items.map(item =>
                      h("button", { key: item.id, className: "palette-item", onClick: item.run },
                        h("span", null, item.label),
                        h("span", { className: "palette-kind" }, item.kind)
                      )
                    )
                  )
                )
          )
        )
      );
    }

                  h("p", { className: "repo-hub-desc" }, PORTFOLIO.projectsHub.description)
                ),
                h("span", { className: "status-chip verified" },
                  h("span", { className: "jade-dot" }),
                  "Primary Hub Repo"
                )
              ),

              h("div", { className: "repo-tree" },
                ...PORTFOLIO.projectsHub.structure.map(item =>
                  h("div", { key: item.dir, className: "repo-tree-cell" },
                    h("span", { className: "repo-tree-dir" }, item.dir),
                    h("span", { className: "repo-tree-note" }, item.note)
                  )
                )
              ),

              h("div", { className: "repo-hub-foot" },
                h("span", { style: { fontFamily: "var(--font-mono)", fontSize: "0.72rem", color: "var(--ink-muted)" } },
                  `git clone ${PORTFOLIO.projectsHub.cloneUrl}`
                ),
                h("div", { className: "repo-actions" },
                  h("button", {
                    className: "mini-action-btn",
                    onClick: () => copyText(`git clone ${PORTFOLIO.projectsHub.cloneUrl}`, "Copied git clone command")
                  }, h(Icon, { name: "copy", size: 12 }), "Clone"),
                  h("a", {
                    href: PORTFOLIO.projectsHub.url,
                    target: "_blank",
                    rel: "noopener noreferrer",
                    className: "mini-action-btn"
                  }, "Open Hub ↗")
                )
              )
            ),

            // Language Filter & Live Repository Ledger
            h("div", { className: "filter-bar" },
              h("div", { className: "filter-pills", role: "tablist", "aria-label": "Filter repositories by language" },
                ...repoLanguages.map(lang =>
                  h("button", {
                    key: lang,
                    role: "tab",
                    "aria-selected": String(repoLang === lang),
                    className: `filter-pill ${repoLang === lang ? "active" : ""}`,
                    onClick: () => setRepoLang(lang)
                  }, lang)
                )
              ),
              h("a", {
                href: `${PORTFOLIO.githubUrl}?tab=repositories`,
                target: "_blank",
                rel: "noopener noreferrer",
                className: "filter-count"
              }, `${filteredRepos.length} ${filteredRepos.length === 1 ? "repository" : "repositories"} · GitHub ↗`)
            ),

            h("div", { className: "repo-ledger" },
              ...filteredRepos.map(repo =>
                h("div", { key: repo.name, className: "repo-row" },
                  h("div", null,
                    h("div", { className: "repo-head-line" },
                      h("a", {
                        href: repo.url,
                        target: "_blank",
                        rel: "noopener noreferrer",
                        className: "repo-name-link"
                      },
                        h(Icon, { name: "repo", size: 13 }),
                        repo.name
                      ),
                      repo.featured ? h("span", { className: "status-chip verified" }, "Hub") : null
                    ),
                    h("p", { className: "repo-desc" }, repo.description),
                    h("div", { className: "repo-meta-line" },
                      repo.language ? h("span", { className: "lang-badge" }, h("span", { className: "lang-dot" }), repo.language) : null,
                      repo.stars > 0 ? h("span", null, `★ ${repo.stars}`) : null,
                      repo.forks > 0 ? h("span", null, `Forks ${repo.forks}`) : null,
                      repo.updated ? h("span", null, `Updated ${repo.updated}`) : null,
                      ...(repo.topics || []).slice(0, 3).map(topic => h("span", { key: topic, className: "chip" }, topic))
                    )
                  ),
                  h("div", { className: "repo-actions" },
                    h("button", {
                      className: "mini-action-btn",
                      onClick: () => copyText(`git clone ${repo.cloneUrl}`, `Copied clone URL for ${repo.name}`)
                    }, h(Icon, { name: "copy", size: 12 }), "Clone"),
                    h("a", {
                      href: repo.url,
                      target: "_blank",
                      rel: "noopener noreferrer",
                      className: "mini-action-btn"
                    }, "View ↗")
                  )
                )
              )
            )
          ),

          // FIELD NOTES
          h("section", { id: "notes", className: "section reveal d3" },
            h("div", { className: "section-head" },
              h("div", null,
                h("div", { className: "section-eyebrow" }, "Writing"),
                h("h2", { className: "section-title" }, "Architecture & Field Notes")
              ),
              h("span", { className: "section-meta" }, "Select a note to read")
            ),

            h("div", { className: "notes-ledger" },
              ...PORTFOLIO.notes.map(note =>
                h("button", { key: note.id, className: "note-row", onClick: () => setSelectedNote(note) },
                  h("span", { className: "note-date" }, note.date),
                  h("div", null,
                    h("div", { className: "note-title" }, note.title),
                    h("p", { className: "note-excerpt" }, note.excerpt)
                  ),
                  h("span", { className: "note-read" }, `${note.readTime} →`)
                )
              )
            )
          ),

          // BACKGROUND & CAPABILITIES
          h("section", { id: "background", className: "section reveal d3" },
            h("div", { className: "section-head" },
              h("div", null,
                h("div", { className: "section-eyebrow" }, "Background"),
                h("h2", { className: "section-title" }, "Experience & Core Capabilities")
              ),
              h("span", { className: "section-meta" }, "Expand roles for details")
            ),

            h("div", { className: "exp-list" },
              ...PORTFOLIO.experience.map((item, idx) => {
                const expanded = !!openExp[idx];
                return h("div", { key: item.role, className: "exp-card" },
                  h("button", {
                    className: "exp-trigger",
                    onClick: () => setOpenExp(prev => ({ ...prev, [idx]: !prev[idx] })),
                    "aria-expanded": String(expanded)
                  },
                    h("span", { className: "exp-period" }, item.period),
                    h("div", null,
                      h("div", { className: "exp-role" }, item.role),
                      h("div", { className: "exp-org" }, item.org)
                    ),
                    h("span", { className: "exp-chevron" }, expanded ? "Hide −" : "Details +")
                  ),
                  expanded ? h("div", { className: "exp-panel" },
                    h("ul", { className: "bullet-list" },
                      ...item.bullets.map((b, i) => h("li", { key: String(i) }, b))
                    )
                  ) : null
                );
              })
            ),

            h("div", { className: "pillars-grid" },
              ...PORTFOLIO.capabilities.map(group =>
                h("div", { key: group.pillar, className: "pillar-card" },
                  h("div", { className: "pillar-title" }, group.pillar),
                  h("div", { className: "pillar-items" },
                    ...group.items.map(skill => h("span", { key: skill, className: "pillar-tag" }, skill))
                  )
                )
              )
            )
          ),

          // CREDENTIALS LEDGER
          h("section", { id: "credentials", className: "section reveal d4" },
            h("div", { className: "section-head" },
              h("div", null,
                h("div", { className: "section-eyebrow" }, "Credentials"),
                h("h2", { className: "section-title" }, "Verified Badges & Certification Track")
              ),
              h("div", { className: "section-meta" },
                h("a", { href: PORTFOLIO.skillsProfileUrl, target: "_blank", rel: "noopener noreferrer" }, "Public Google Skills profile ↗")
              )
            ),

            h("div", { className: "cred-ledger" },
              ...PORTFOLIO.credentials.map(cred =>
                h("a", {
                  key: cred.title,
                  href: cred.url,
                  target: "_blank",
                  rel: "noopener noreferrer",
                  className: `cred-row ${cred.verified ? "verified" : ""}`
                },
                  h("div", { className: "cred-main" },
                    h("div", { className: "cred-code" }, cred.code),
                    h("div", { style: { minWidth: "0" } },
                      h("div", { className: "cred-name" }, cred.title),
                      h("div", { className: "cred-issuer" }, cred.issuer)
                    )
                  ),
                  h("div", { className: "cred-right" },
                    h("span", { className: `status-chip ${cred.verified ? "verified" : ""}` },
                      cred.verified ? h("span", { className: "jade-dot" }) : null,
                      cred.status
                    ),
                    h("span", { className: "cred-verify" }, "Verify ↗")
                  )
                )
              )
            )
          ),

          // FOOTER CONTACT BAND
          h("footer", { className: "reveal d4" },
            h("div", { className: "footer-card" },
              h("div", { className: "footer-identity" },
                h("div", { className: "footer-avatar" },
                  h(ProfileAvatar, {
                    src: resolvedAvatarUrl,
                    alt: `${PORTFOLIO.name} profile photo`,
                    monogram: PORTFOLIO.monogram,
                    variant: "footer"
                  })
                ),
                h("div", null,
                  h("h2", { className: "footer-heading" }, "Let's connect"),
                  h("p", { className: "footer-copy" },
                    "Available for Cloud Security Engineer interviews, IaC security reviews, and open-source GCP lab collaborations."
                  )
                )
              ),
              h("div", { className: "footer-actions" },
                h("button", { className: "btn btn-primary", onClick: copyEmail },
                  h(Icon, { name: "copy", size: 14 }),
                  copiedEmail ? "Copied!" : PORTFOLIO.email
                ),
                h("a", { href: `mailto:${PORTFOLIO.email}`, className: "btn btn-secondary" }, "Email ↗"),
                h("a", { href: PORTFOLIO.githubUrl, target: "_blank", rel: "noopener noreferrer", className: "btn btn-secondary" }, `@${PORTFOLIO.githubHandle} ↗`)
              )
            ),

            h("div", { className: "colophon" },
              h("span", null, `${PORTFOLIO.name} · ${PORTFOLIO.role}`),
              h("span", null, `© ${new Date().getFullYear()} · Hosted on GitHub Pages`)
            )
          )
        ),

        // Slide-over Drawers & Quick Jump Palette
        h(CaseStudyDrawer, { project: selectedProject, onClose: () => setSelectedProject(null), onCopy: copyText }),
        h(NoteReaderDrawer, { note: selectedNote, onClose: () => setSelectedNote(null) }),
        h(QuickJump, {
          open: paletteOpen,
          onClose: () => setPaletteOpen(false),
          repos: gh.repos,
          onSelectProject: setSelectedProject,
          onSelectNote: setSelectedNote,
          onToggleTheme: toggleTheme,
          onCopyEmail: copyEmail
        }),

        toastMsg ? h("div", { className: "toast", role: "status" }, toastMsg) : null
      );
    }

    React.ReactDOM.createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
